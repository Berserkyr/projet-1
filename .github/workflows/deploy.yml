name: Build and Deploy Container

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy-target-machine:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy compose file to target
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: "docker-compose.prod.yml"
          target: "${{ secrets.REMOTE_APP_DIR || '/opt/demo-app' }}"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_OWNER: ${{ github.repository_owner }}
          GHCR_REPO: ${{ github.event.repository.name }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          REMOTE_APP_DIR: ${{ secrets.REMOTE_APP_DIR || '/opt/demo-app' }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: GHCR_OWNER,GHCR_REPO,GHCR_USERNAME,GHCR_TOKEN,REMOTE_APP_DIR
          script: |
            mkdir -p "$REMOTE_APP_DIR"
            mv "$REMOTE_APP_DIR/docker-compose.prod.yml" "$REMOTE_APP_DIR/docker-compose.yml"
            cat > "$REMOTE_APP_DIR/.env" <<EOF
            GHCR_OWNER=$GHCR_OWNER
            GHCR_REPO=$GHCR_REPO
            EOF
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
            docker compose -f "$REMOTE_APP_DIR/docker-compose.yml" --env-file "$REMOTE_APP_DIR/.env" pull
            docker compose -f "$REMOTE_APP_DIR/docker-compose.yml" --env-file "$REMOTE_APP_DIR/.env" up -d
            docker image prune -f
